<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meditation Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14172b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meditate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="setup">
      <header>
        <h1>Meditate</h1>
      </header>

      <div class="group duration-line">
        <h2>
          <span>Duration <span id="duration"></span></span>
          <span id="sound-summary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
            <span id="sound-name"></span>
          </span>
        </h2>
        <button id="settings-toggle" class="icon" aria-label="Settings" aria-expanded="false" aria-controls="options">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div id="options" hidden>
        <div class="panel">
          <div class="group">
            <h2>Duration</h2>
            <div id="presets" class="tiles presets"></div>
          </div>

          <div class="group">
            <h2>Bowl or bell</h2>
            <div id="sounds" class="tiles"></div>
            <button id="preview" class="text">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
              Listen
            </button>
          </div>

          <div class="setting">
            <span class="label">Sound</span>
            <button id="mute" aria-label="Sound on or off">On</button>
          </div>

          <div class="setting">
            <span class="label">Bells</span>
            <div class="stepper">
              <button id="bells-minus" aria-label="Fewer bells">&minus;</button>
              <span id="bells-count">3</span>
              <button id="bells-plus" aria-label="More bells">+</button>
            </div>
          </div>

          <div class="setting">
            <span class="label">Gap between bells</span>
            <div class="stepper">
              <button id="gap-minus" aria-label="Shorter gap">&minus;</button>
              <span id="gap-count">5 s</span>
              <button id="gap-plus" aria-label="Longer gap">+</button>
            </div>
          </div>

          <div class="setting">
            <span class="label">Settle in</span>
            <div class="stepper">
              <button id="countdown-minus" aria-label="Shorter countdown">&minus;</button>
              <span id="countdown-count">10</span>
              <button id="countdown-plus" aria-label="Longer countdown">+</button>
            </div>
          </div>

          <label class="setting field">
            <span class="label">Instruction</span>
            <input id="instruction" type="text" autocomplete="off" enterkeyhint="done">
          </label>

          <p id="audio-note" role="status"></p>
        </div>
      </div>

      <button id="start" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
        Begin session
      </button>
    </section>

    <section id="session" hidden>
      <div id="phase" role="status"></div>
      <div id="orb">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="92"/>
          <circle id="ring" cx="100" cy="100" r="92" pathLength="100"/>
        </svg>
        <div id="time"></div>
        <img id="tree" src="icon-512.png" alt="" hidden>
      </div>
      <p id="thanks" hidden>Thank you for tending the seed</p>
      <button id="pause">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
        <span>Pause</span>
      </button>
      <button id="close" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back
      </button>
      <button id="cancel" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        End session
      </button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
