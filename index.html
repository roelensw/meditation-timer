<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meditation Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meditate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="setup">
      <h1>Meditation</h1>

      <h2>Duration</h2>
      <div id="presets" class="row"></div>

      <h2>Sound</h2>
      <div id="sounds" class="row"></div>

      <h2>Bells</h2>
      <div class="row stepper">
        <button id="bells-minus" aria-label="Fewer bells">&minus;</button>
        <span id="bells-count">3</span>
        <button id="bells-plus" aria-label="More bells">+</button>
        <button id="preview" class="ghost">Preview</button>
      </div>

      <button id="start" class="primary">Start</button>
    </section>

    <section id="session" hidden>
      <div id="phase"></div>
      <div id="time"></div>
      <button id="cancel" class="ghost">Cancel</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
